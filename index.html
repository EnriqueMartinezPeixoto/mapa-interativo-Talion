<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Talion — Atlas interativo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>:root{--ink:#1f2744;--ink2:#2b3558;--paper:#eef3fa;--mist:#c7d4e8;--muted:#9fb0cf;--sea:#6a8abb;--acc:#aab6cf}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#141a33;color:var(--paper);font-family:'Alegreya Sans','Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#c2d,#c3d{position:absolute;inset:0;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.panel{background:rgba(31,39,68,.95);border-radius:14px;box-shadow:0 10px 30px rgba(8,12,30,.45),inset 0 0 0 1px rgba(238,243,250,.14);outline:1px solid rgba(238,243,250,.12);outline-offset:3px}
h1,h2{font-family:'Almendra','Palatino Linotype',Georgia,serif;font-weight:700;margin:0;letter-spacing:.01em}
/* topo */
#top{position:absolute;left:18px;top:18px;width:300px;padding:12px 14px 12px;z-index:5}
#crumb h1{font-size:30px;line-height:1.05}
#crumb p{margin:2px 0 0;color:var(--muted);font-size:14px}
#crumb .back{background:none;border:0;padding:0 0 4px;color:var(--mist);font-size:14px}
#crumb .back:hover{color:#fff;text-decoration:underline}
#modes{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;padding:4px;gap:4px;z-index:5;border-radius:999px}
#modes button{border:0;background:none;padding:6px 18px;border-radius:999px;color:var(--mist);font-weight:600}
#modes button.on{background:var(--paper);color:var(--ink)}
/* atlas */
#atlas{position:absolute;left:18px;top:132px;bottom:18px;width:300px;display:flex;flex-direction:column;padding:12px;z-index:4}
#atlas input{width:100%;padding:9px 12px;border-radius:10px;border:0;background:rgba(238,243,250,.1);color:var(--paper);font:inherit}
#atlas input::placeholder{color:var(--muted)}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
#chips:empty{display:none}
#chips button{border:1px solid rgba(238,243,250,.22);background:none;border-radius:999px;padding:2px 10px;font-size:13px;color:var(--mist);--c:var(--paper)}
#chips button.on{background:var(--c);color:var(--ink);border-color:var(--c)}
#list{flex:1;overflow:auto;margin-top:10px;scrollbar-width:thin;scrollbar-color:#4a5686 transparent}
.grp{margin-bottom:10px}
.kh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:4px 6px;font-family:'Almendra',Georgia,serif;font-size:18px;border-radius:8px}
button.kh:hover{background:rgba(238,243,250,.08)}
.kh i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.grp ul,.pl{list-style:none;margin:0;padding:0}
.grp li button,.pl li button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 8px 5px 26px;border-radius:8px;color:var(--paper)}
.grp li button small{color:var(--muted);font-size:12px}
.grp li button.cap{font-weight:700}
.grp li button:hover,.pl li button:hover{background:rgba(238,243,250,.08)}
button.cur{background:rgba(238,243,250,.16)!important}
.pl li button{padding:6px 8px;justify-content:flex-start}
.pl li b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-size:13px}
.pl li span{display:flex;flex-direction:column;line-height:1.2}
.pl li small{color:var(--muted);font-size:12px}
/* cartão */
#card{position:absolute;right:18px;top:18px;width:340px;max-height:calc(100% - 100px);overflow:auto;padding:16px 18px 18px;z-index:6;border-left:5px solid var(--acc);display:none}
#card.open{display:block;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#card h2{font-size:26px;line-height:1.1;padding-right:26px}
#card .sub{color:var(--muted);margin:3px 0 10px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#card p{margin:0 0 10px}
#card .pn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--ink);font-size:12px}
#card .x{position:absolute;right:10px;top:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(238,243,250,.1);font-size:20px;line-height:1}
#card .x:hover{background:rgba(238,243,250,.2)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px;font-size:15px}
dt{color:var(--muted)}dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:rgba(238,243,250,.1);border-radius:999px;padding:2px 10px;font-size:13px}
.lst{display:flex;flex-wrap:wrap;gap:6px}
.lst button{border:1px solid rgba(238,243,250,.25);background:none;border-radius:999px;padding:3px 12px}
.lst button:hover{background:rgba(238,243,250,.12)}
.act{margin-top:6px}
.primary{width:100%;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--ink);font-weight:700;font-size:16px}
.primary:hover{filter:brightness(1.08)}
/* ferramentas */
#tools{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:5}
#tools button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(31,39,68,.95);font-size:20px;box-shadow:inset 0 0 0 1px rgba(238,243,250,.16)}
#tools button:hover{background:var(--ink2)}
#hint{position:absolute;left:340px;bottom:18px;z-index:3;color:#fff;font-size:14px;text-shadow:0 1px 4px rgba(10,14,34,.9),0 0 2px #0a0e22;pointer-events:none;max-width:40vw}
#status{position:absolute;left:50%;bottom:18px;transform:translate(-50%,8px);background:var(--paper);color:var(--ink);padding:6px 16px;border-radius:999px;font-weight:600;opacity:0;transition:.15s;pointer-events:none;z-index:6;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#status.on{opacity:1;transform:translate(-50%,0)}
#atlasBtn{display:none}
/* marcadores */
.mk{position:absolute;left:0;top:0;width:0;height:0;border:0;padding:0;background:none;pointer-events:auto;will-change:transform}
.mk .dot{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:grid;place-items:center;font-style:normal;transition:box-shadow .15s}
.mk .nm{position:absolute;left:15px;top:0;transform:translateY(-50%);white-space:nowrap;font-family:'Almendra',Georgia,serif;font-size:15px;color:var(--ink);text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 6px var(--paper);opacity:0;pointer-events:none;transition:opacity .12s}
.mk.lbl .nm,.mk:hover .nm,.mk.sel .nm{opacity:1}
.mk:hover,.mk.sel{z-index:3}
.mk.cap .dot{width:26px;height:26px;border-radius:50%;background:var(--c);border:3px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.cap .dot::after{content:"";width:12px;height:9px;background:var(--ink);clip-path:polygon(0 100%,0 15%,28% 55%,50% 0,72% 55%,100% 15%,100% 100%)}
.mk.cap .nm{left:19px;font-size:17px;font-weight:700}
.mk.city .dot{width:15px;height:15px;border-radius:50%;background:var(--ink);border:3.5px solid var(--c);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.mk.poi .dot{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid var(--paper);color:var(--ink);font:700 13px 'Alegreya Sans',sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.mk.poi .nm{left:19px;font-size:14px}
.mk.sel .dot{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 2px 8px rgba(0,0,0,.4);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,.2),0 2px 8px rgba(0,0,0,.4)}}
.mk:focus-visible .dot{outline:2px solid #fff;outline-offset:3px}
/* carregando e transição */
#veil{position:absolute;inset:0;background:#141a33;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#veil.on{opacity:1;pointer-events:auto}
#loader{position:absolute;inset:0;z-index:30;background:#141a33;display:grid;place-items:center;text-align:center;transition:opacity .5s}
#loader.off{opacity:0;pointer-events:none}
#loader h2{font-size:44px}
#loader p{color:var(--muted);margin:6px 0 0}
/* celular */
@media (max-width:800px){
  #top{width:auto;left:10px;top:10px;padding:8px 12px}
  #crumb h1{font-size:22px}#crumb p{display:none}
  #modes{top:10px;left:auto;right:10px;transform:none}
  #modes button{padding:5px 12px}
  #atlas{display:none;left:10px;right:10px;top:70px;bottom:10px;width:auto;z-index:8}
  #atlas.open{display:flex}
  #atlasBtn{display:block;position:absolute;left:10px;bottom:10px;z-index:5;border:0;border-radius:999px;padding:9px 16px;background:rgba(31,39,68,.95);font-weight:600;box-shadow:inset 0 0 0 1px rgba(238,243,250,.2)}
  #card{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:46vh}
  #tools{right:10px;bottom:auto;top:62px}
  #tools button{width:38px;height:38px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){#card.open{animation:none}.mk.sel .dot{animation:none}}
/* edição */
#modes #editBtn{margin-left:4px;border:1px solid rgba(238,243,250,.25)}
#modes #editBtn.on{background:#f2b640;color:var(--ink);border-color:#f2b640}
#etools{display:none;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:6;padding:8px;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 40px)}
body.edit #etools{display:flex}
body.edit #status{bottom:78px}
body.edit #hint{bottom:78px;left:340px}
#etools button{border:1px solid rgba(238,243,250,.25);background:none;border-radius:999px;padding:5px 14px;font-size:15px;color:var(--paper)}
#etools button:hover{background:rgba(238,243,250,.12)}
#etools button.on{background:#f2b640;color:var(--ink);border-color:#f2b640}
#etools i{width:1px;height:22px;background:rgba(238,243,250,.25)}
#etools .warn{flex-basis:100%;font-size:13px;color:#ffb4a6;text-align:center}
.ed{display:flex;gap:6px;margin-top:10px}
.ed button,.drow button{border:1px solid rgba(238,243,250,.3);background:none;border-radius:10px;padding:7px 14px}
.ed button:hover,.drow button:hover{background:rgba(238,243,250,.12)}
button.danger{border-color:#e8806f;color:#ffb4a6}
.drow button.primary{width:auto;background:#f2b640;color:var(--ink);border:0}
.drow button.primary.danger{background:#e8806f;color:#2a0d08}
#dlg{display:none;position:absolute;inset:0;z-index:40;background:rgba(10,14,34,.6);place-items:center;padding:14px}
#dlg.open{display:grid}
.dbox{width:min(440px,100%);max-height:calc(100vh - 28px);overflow:auto;padding:18px}
.dbox h3{font-family:'Almendra',Georgia,serif;font-size:24px;margin:0 0 6px}
#dlgM{margin:0 0 10px;color:var(--muted);font-size:14px}#dlgM:empty{display:none}
#dlgF label{display:block;margin:0 0 10px;font-size:14px;color:var(--mist)}
#dlgF input[type=text],#dlgF input[type=number],#dlgF select,#dlgF textarea{display:block;width:100%;margin-top:3px;padding:8px 10px;border-radius:8px;border:1px solid rgba(238,243,250,.2);background:rgba(238,243,250,.08);color:var(--paper);font:inherit;font-size:16px}
#dlgF select option{color:#1f2744}
#dlgF textarea{resize:vertical}
#dlgF input[type=color]{display:block;margin-top:3px;width:60px;height:34px;border:0;background:none;padding:0}
#dlgF .chk{display:flex;gap:8px;align-items:center;color:var(--paper);font-size:15px}
.drow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.drow .sp{flex:1}#dlgX{display:flex;gap:6px}
.mk.lm .dot{width:14px;height:14px;background:var(--c);border:2.5px solid var(--ink);border-radius:3px;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 2px 5px rgba(0,0,0,.35)}
@media (max-width:800px){body.edit #hint{display:none}body.edit #etools{bottom:10px}body.edit #card{bottom:90px}body.edit #status{bottom:130px}}
/* ícones e masmorras */
.mk.ic .dot{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid var(--paper);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.mk.lm.ic .dot{border:2.5px solid var(--ink);transform:translate(-50%,-50%)}
.mk.unk .dot{border-style:dashed;background:rgba(238,243,250,.92)}
.mk .dot svg{display:block}
.pl li b svg{display:block}
.newdg{margin:6px 0 0 8px;border:1px dashed rgba(238,243,250,.35);background:none;border-radius:10px;padding:5px 12px;font-size:14px;color:var(--mist)}
.newdg:hover{background:rgba(238,243,250,.1)}
#dgtools{display:none;position:absolute;left:50%;top:74px;transform:translateX(-50%);z-index:5;padding:6px;gap:6px;border-radius:999px}
body.indg #dgtools{display:flex}
#dgtools button{border:1px solid rgba(238,243,250,.25);background:none;border-radius:999px;padding:5px 14px;font-size:15px;color:var(--paper)}
#dgtools button:hover{background:rgba(238,243,250,.12)}
@media (max-width:800px){#dgtools{top:62px}}
body.indg .mk .nm{color:#fff;text-shadow:0 0 3px #0a0e22,0 0 3px #0a0e22,0 0 6px #0a0e22}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c2d"></canvas>
    <canvas id="c3d"></canvas>
    <div id="labels"></div>
  </div>
  <header id="top" class="panel"><div id="crumb"></div></header>
  <nav id="modes" class="panel" aria-label="Modo de visualização"><button data-mode="2d">2D · de cima</button><button data-mode="3d" class="on">3D · explorar</button><button id="editBtn" data-act="editmode" title="Adicionar e editar">✎ Editar</button></nav>
  <aside id="atlas" class="panel">
    <input id="q" type="search" placeholder="Buscar" aria-label="Buscar">
    <div id="chips"></div>
    <div id="list"></div>
  </aside>
  <section id="card" class="panel" aria-live="polite"></section>
  <div id="tools"><button data-act="zin" aria-label="Aproximar">+</button><button data-act="zout" aria-label="Afastar">−</button><button data-act="home" aria-label="Recentralizar">⌖</button></div>
  <button id="atlasBtn" data-act="atlas">Atlas</button>
  <div id="hint"></div>
  <div id="etools" class="panel"></div>
  <div id="dgtools" class="panel"><button data-act="dgregen">Gerar outra</button><button data-act="dgconfig">Configurar</button><button data-act="dgdel" class="danger">Excluir</button></div>
  <div id="status"></div>
  <div id="dlg"><div class="dbox panel"><h3 id="dlgT"></h3><p id="dlgM"></p><div id="dlgF"></div>
    <div class="drow"><button type="button" data-d="del" id="dlgDel" class="danger">Excluir</button><span id="dlgX"></span><span class="sp"></span><button type="button" data-d="cancel">Cancelar</button><button type="button" data-d="ok" id="dlgOk" class="primary">Salvar</button></div></div></div>
  <div id="veil"></div>
  <div id="loader"><div><h2>Talion</h2><p>Desenhando o continente…</p></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

      const c = [(q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4];
      if (!M.inside(c[0], c[1], 6) || inZone(c[0], c[1], 1)) continue;
      if (q.some(p => !M.inside(p[0], p[1], 3) || inZone(p[0], p[1], 0))) continue;
      if (!sym && R() > density) { M.yards.push({ x: c[0], y: c[1] }); continue; }
      const sf = sym ? 0.86 : lerp(0.78, 0.95, R());
      q = q.map(p => [c[0] + (p[0] - c[0]) * sf, c[1] + (p[1] - c[1]) * sf]);
      const dist = Math.hypot(c[0], c[1]);
      let h = sym ? hBase + 1.6 : hBase + R() * 3.2;
      if (!sym) { h *= 1 + 0.8 * Math.max(0, 1 - dist / 65); if (R() < 0.07) h *= 1.5; }
      const wi = sym ? 0 : Math.floor(R() * th.walls.length), ri = sym ? 0 : Math.floor(R() * th.roofs.length);
      let o = { h, wall: th.walls[wi], roof: th.roofs[ri], roofType: h > 8.5 ? (R() < 0.6 ? 'pyr' : 'flat') : (R() < 0.82 ? 'gable' : 'flat') };
      if (sym) o.roofType = 'gable';
      if (M.coast && M.isWater(c[0], c[1], -16)) { o = { h: 3.4 + R() * 1.2, wall: '#a89070', roof: '#6f5a44', roofType: 'gable', warehouse: true }; }
      M.buildings.push(mkB(q, o));
    }
  }

  /* muralha */
  if (g.wall !== false && !M.island) {
    const K = 96, P = [];
    for (let k = 0; k < K; k++) { const a = k / K * TAU, r = M.Rm(a) + 0.5; P.push([Math.cos(a) * r, Math.sin(a) * r]); }
    const gateK = new Set();
    for (let q = 0; q < 4; q++) gateK.add(Math.round((((rot + q * Math.PI / 2) % TAU) + TAU) % TAU / TAU * K) % K);
    for (let k = 0; k < K; k++) {
      const a = P[k], b = P[(k + 1) % K];
      const wet = M.isWater(a[0], a[1], -1) || M.isWater(b[0], b[1], -1);
      const isGate = gateK.has(k) || gateK.has((k + 1) % K);
      if (!wet && !isGate) M.walls.push({ a, b, t: 2.4, h: 6.5 });
      if (k % 8 === 0 && !M.isWater(a[0], a[1], -1) && !gateK.has(k)) M.towers.push({ x: a[0], y: a[1], r: 2.5, h: 10.5, roof: true });
    }
    for (const gk of gateK) {
      const p = P[gk]; if (M.isWater(p[0], p[1], -1)) continue;
      M.gates.push([p[0], p[1]]);
      for (const d of [-1, 1]) { const t = P[(gk + d + K) % K]; M.towers.push({ x: t[0], y: t[1], r: 2.9, h: 12.5, roof: true }); }
    }
  }

  /* porto */
  if (M.coast) {
    const c = M.coast, ang = Math.atan2(c.ny, c.nx);
    for (let t = -62; t <= 62; t += 11 + R() * 7) {
      if (R() < 0.22) continue;
      const sh = c.shoreAt(t), len = 10 + R() * 10, bx = t * c.tx + (sh - 2) * c.nx, by = t * c.ty + (sh - 2) * c.ny;
      if (Math.hypot(bx, by) > M.Rm(Math.atan2(by, bx)) + 14) continue;
      M.piers.push({ x: bx + c.nx * len / 2, y: by + c.ny * len / 2, ang, len, w: 2.6 });
      for (const s of [-1, 1]) {
        if (R() < 0.35) continue;
        const al = len * (0.25 + R() * 0.5);
        M.boats.push({ x: bx + c.nx * al + c.tx * s * 3.1, y: by + c.ny * al + c.ty * s * 3.1, ang, len: 4.6 + R() * 2, w: 2, color: pick(R, ['#8a6a47', '#6f5a44', '#a6794d', '#5c6f86']), sail: R() < 0.6 ? '#f4efe2' : null });
      }
    }
    const t0 = (R() - 0.5) * 50, sh0 = c.shoreAt(t0), bx = t0 * c.tx + (sh0 - 2) * c.nx, by = t0 * c.ty + (sh0 - 2) * c.ny;
    M.piers.push({ x: bx + c.nx * 13, y: by + c.ny * 13, ang, len: 26, w: 4, stone: true });
    M.towers.push({ x: bx + c.nx * 25, y: by + c.ny * 25, r: 2.4, h: 17, roof: true, light: true, white: true });
    for (let i = 0; i < 3; i++) {
      const t = -62 + i * 55 + R() * 20, n = c.shoreAt(t) + 26 + R() * 18;
      M.boats.push({ x: t * c.tx + n * c.nx, y: t * c.ty + n * c.ny, ang: ang + (R() - 0.5) * 1.2, len: 12, w: 3.6, color: pick(R, ['#6f5a44', '#5c4a3a']), sail: '#f1ead8', ship: true });
    }
  }
  /* ilha flutuante: docas de dirigíveis na borda */
  if (M.island) {
    for (let i = 0; i < 3; i++) {
      const a = (i * 2.1 + 0.4 + R() * 0.3), r = M.Rm(a), ca = Math.cos(a), sa = Math.sin(a);
      M.piers.push({ x: ca * (r + 5), y: sa * (r + 5), ang: a, len: 16, w: 3, dock: true });
      M.boats.push({ x: ca * (r + 15), y: sa * (r + 15), ang: a + 0.2, len: 9, w: 3, color: '#5b4a77', sail: '#cfd6f5', air: true });
    }
  }

  /* praça central: fonte ou círculo rúnico */
  if (pl) {
    if (pl.rune || th.night) M.runes.push({ x: pl.x, y: pl.y, r: pl.r * 0.82 });
    else M.props.push({ t: 'fountain', x: pl.x, y: pl.y, r: 2.8 });
  }
  /* barracas do mercado */
  if (g.stalls && pl) {
    const cols = ['#d1583f', '#e0a24f', '#5d86c2', '#6fae75', '#b8689a', '#efe0b4'];
    for (let i = 0; i < g.stalls; i++) {
      const a = i / g.stalls * TAU, rr = pl.r * (i % 2 ? 0.58 : 0.82);
      M.stalls.push({ x: pl.x + Math.cos(a) * rr, y: pl.y + Math.sin(a) * rr, ang: a + Math.PI / 2, color: pick(R, cols) });
    }
  }
  /* lampiões */
  if (g.lamps || th.night) {
    for (const r of M.roads) if (r.main) {
      let acc = 0;
      for (let i = 1; i < r.pts.length; i++) {
        const a = r.pts[i - 1], b = r.pts[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]); acc += L;
        if (acc > 13) { acc = 0; const nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L; for (const s of [-1, 1]) M.lamps.push([b[0] + nx * s * (r.w / 2 + 1), b[1] + ny * s * (r.w / 2 + 1)]); }
      }
    }
  }
  /* pedras (montanha) */
  if (g.rocks) {
    for (let n = 0; n < 80; n++) {
      const a = R() * TAU, r = M.Rm(a) + 6 + R() * 28, x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (Math.abs(x) > 104 || Math.abs(y) > 104 || M.isWater(x, y, -6)) continue;
      M.rocks.push({ x, y, r: 3 + R() * 6, h: 4 + R() * 9 });
    }
  }
  /* árvores */
  const nt = g.treeCount !== undefined ? g.treeCount : 110;
  for (const yd of M.yards) { const n = 1 + ((R() * 3) | 0); for (let i = 0; i < n; i++) M.trees.push({ x: yd.x + (R() - 0.5) * 8, y: yd.y + (R() - 0.5) * 8, r: 1.8 + R() * 1.6, t: R() < 0.3 ? 1 : 0 }); }
  if (!M.island) for (let n = 0; n < nt; n++) {
    const x = (R() * 2 - 1) * (M.B - 5), y = (R() * 2 - 1) * (M.B - 5);
    if (Math.hypot(x, y) < M.Rm(Math.atan2(y, x)) + 6 || M.isWater(x, y, -6)) continue;
    M.trees.push({ x, y, r: 2 + R() * 2.4, t: R() < 0.35 ? 1 : 0 });
  }
  if (g.avenue) for (const r of M.roads) if (r.main) {
    let acc = 0;
    for (let i = 1; i < r.pts.length; i++) {
      const a = r.pts[i - 1], b = r.pts[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]); acc += L;
      if (acc > 9) { acc = 0; const nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L; for (const s of [-1, 1]) { const x = b[0] + nx * s * 4.4, y = b[1] + ny * s * 4.4; if (!inZone(x, y, 0) && !M.hit(x, y, 1)) M.trees.push({ x, y, r: 1.7, t: 0 }); } }
    }
  }
  M.trees = M.trees.filter(t => !M.hit(t.x, t.y, 0.8) && !inZone(t.x, t.y, -2));
}

function makeCastle(M, R, c) {
  const th = M.theme, a = c.ang || 0, s = c.r * 0.8, ca = Math.cos(a), sa = Math.sin(a);
  const P = [[-s, -s], [s, -s], [s, s], [-s, s]].map(([x, y]) => [c.x + x * ca - y * sa, c.y + x * sa + y * ca]);
  let gi = 0, best = 1e9;
  for (let i = 0; i < 4; i++) { const m = [(P[i][0] + P[(i + 1) % 4][0]) / 2, (P[i][1] + P[(i + 1) % 4][1]) / 2], d = Math.hypot(m[0], m[1]); if (d < best) { best = d; gi = i; } }
  for (let i = 0; i < 4; i++) {
    const A = P[i], B = P[(i + 1) % 4];
    if (i === gi) {
      const g1 = [lerp(A[0], B[0], 0.36), lerp(A[1], B[1], 0.36)], g2 = [lerp(A[0], B[0], 0.64), lerp(A[1], B[1], 0.64)];
      M.walls.push({ a: A, b: g1, t: 2.2, h: 7.5 }, { a: g2, b: B, t: 2.2, h: 7.5 });
      M.towers.push({ x: g1[0], y: g1[1], r: 2.3, h: 11, roof: true }, { x: g2[0], y: g2[1], r: 2.3, h: 11, roof: true });
    } else M.walls.push({ a: A, b: B, t: 2.2, h: 7.5 });
    M.towers.push({ x: A[0], y: A[1], r: 3.4, h: 14, roof: true });
  }
  M.plazas.push({ poly: P.map(p => [c.x + (p[0] - c.x) * 0.94, c.y + (p[1] - c.y) * 0.94]), castle: true });
  const kp = rectPts(c.x, c.y, s * 1.0, s * 0.9, a);
  const keep = mkB(kp, { h: 18, wall: '#ddd5c2', roof: th.roofs[0], roofType: 'pyr', rh: 9, keep: true });
  M.buildings.push(keep); M.castleKeep = keep;
  for (const p of kp) M.towers.push({ x: p[0], y: p[1], r: 1.6, h: 22, roof: true });
  for (const [ox, oy] of [[-0.55, 0.62], [0.55, 0.62]]) {
    const px = c.x + (ox * s) * ca - (oy * s) * sa, py = c.y + (ox * s) * sa + (oy * s) * ca;
    M.buildings.push(mkB(rectPts(px, py, s * 0.5, s * 0.3, a), { h: 5, wall: '#cfc8b4', roof: th.roofs[1], roofType: 'gable', noPoi: true, keep: true }));
  }
}

/* ============ ponte sobre o penhasco (Crowlrit) ============ */
function genBridge(M, R) {
  const th = M.theme;
  M.isChasm = (x, y) => Math.abs(x) < 72 && Math.abs(y) > 20;
  M.river = []; for (let y = -140; y <= 140; y += 10) M.river.push([7 * Math.sin(y / 23) + 3 * Math.sin(y / 9), y]);
  M.roads.push({ pts: [[-112, 0], [112, 0]], w: 6.2, main: true });
  for (const s of [-1, 1]) { M.roads.push({ pts: [[s * 92, -112], [s * 92, 112]], w: 4.4 }); for (const y of [-52, 52]) M.roads.push({ pts: [[s * 112, y], [s * 76, y]], w: 3 }); }
  M.plazas.push({ x: 0, y: 0, r: 11 });
  M.props.push({ t: 'fountain', x: 0, y: 0, r: 2.6 });
  for (const sy of [-1, 1]) for (const row of [0, 1]) {
    const yc = sy * (row ? 16.6 : 9), dep = row ? 5.4 : 8.4; let x = -67;
    while (x < 66) {
      const w = 5.5 + R() * 4.5; if (x + w > 67) break;
      if (R() < 0.07) { x += 3.2; continue; }
      const cx = x + w / 2;
      if (Math.abs(cx) >= (row ? 9 : 15)) M.buildings.push(mkB(rectPts(cx, yc, w - 0.7, dep, 0), { h: row ? 3.6 + R() * 2.4 : 5 + R() * 4.5, wall: pick(R, th.walls), roof: pick(R, th.roofs), roofType: R() < 0.8 ? 'gable' : 'flat' }));
      x += w;
    }
  }
  for (const s of [-1, 1]) for (let y = -100; y < 100; y += 11 + R() * 5) {
    if (Math.abs(y) < 8) continue;
    for (const side of [-1, 1]) {
      const w = 7 + R() * 3.5, d = 7 + R() * 3.5, cx = s * (92 + side * (2.2 + w / 2 + 0.6));
      if (M.reserved(cx, y, 4)) continue;
      M.buildings.push(mkB(rectPts(cx, y, w, d, 0), { h: 4.5 + R() * 4, wall: pick(R, th.walls), roof: pick(R, th.roofs), roofType: R() < 0.85 ? 'gable' : 'flat' }));
    }
  }
  for (const sy of [-1, 1]) {
    M.walls.push({ a: [-72, sy * 20.4], b: [72, sy * 20.4], t: 1, h: 1.7, rail: true });
    for (const s of [-1, 1]) { M.walls.push({ a: [s * 70, sy * 9.5], b: [s * 70, sy * 20], t: 2, h: 7 }); M.towers.push({ x: s * 70, y: sy * 8, r: 3, h: 14, roof: true }); }
  }
  M.gates = [[-70, 0], [70, 0]];
  M.pylons = []; for (const x of [-48, -16, 16, 48]) for (const y of [-11, 11]) M.pylons.push({ x, y });
  for (let n = 0; n < 40; n++) {
    const s = R() < 0.5 ? -1 : 1, x = s * (78 + R() * 28), y = (R() * 2 - 1) * 105;
    if (!M.hit(x, y, 2.4) && Math.abs(Math.abs(x) - 92) > 4.5 && Math.abs(y) > 5) M.trees.push({ x, y, r: 2 + R() * 2, t: R() < 0.4 ? 1 : 0 });
  }
  M.inside = (x, y) => !M.isChasm(x, y);
}

/* ============ cidade-caravana (Nómada) ============ */
function genCaravan(M, R) {
  const th = M.theme, gAng = [0.15, 0.15 + TAU / 3, 0.15 + 2 * TAU / 3];
  const col = () => { const i = Math.floor(R() * th.walls.length); return [th.walls[i], th.roofs[i]]; };
  M.buildings.push(mkB(rectPts(0, 0, 15, 15, 0.4), { h: 5, wall: '#efe3c4', roof: '#c9573f', roofType: 'tent', rh: 8, big: true }));
  M.props.push({ t: 'fire', x: 0, y: 18 });
  const rings = [{ r: 24, tents: true }, { r: 42 }, { r: 60 }, { r: 78 }];
  const nearGate = a => gAng.some(g => { let d = Math.abs(((a - g + Math.PI) % TAU + TAU) % TAU - Math.PI); return d < 0.1; });
  for (const rg of rings) {
    const n = Math.floor(TAU * rg.r / (rg.tents ? 8 : 9.4));
    for (let k = 0; k < n; k++) {
      const a = k / n * TAU + rg.r * 0.01; if (nearGate(a)) continue;
      const rr = rg.r + (R() - 0.5) * 1.6, cx = Math.cos(a) * rr, cy = Math.sin(a) * rr, c = col();
      if (rg.tents) M.buildings.push(mkB(rectPts(cx, cy, 5, 5, a + R()), { h: 3, wall: c[0], roof: c[1], roofType: 'tent', rh: 3.6 }));
      else M.buildings.push(mkB(rectPts(cx, cy, 7, 3.5, a + Math.PI / 2), { h: 3.1, wall: c[0], roof: c[1], roofType: 'gable', rh: 1.4, wagon: true }));
    }
  }
  for (const r of [12, 33, 51, 69]) { const pts = []; for (let k = 0; k <= 72; k++) pts.push([Math.cos(k / 72 * TAU) * r, Math.sin(k / 72 * TAU) * r]); M.roads.push({ pts, w: r === 12 ? 2.6 : 3 }); }
  for (const a of gAng) { M.roads.push({ pts: [[Math.cos(a) * 14, Math.sin(a) * 14], [Math.cos(a) * 112, Math.sin(a) * 112]], w: 3.6, main: true }); M.gates.push([Math.cos(a) * 80, Math.sin(a) * 80]); }
  M.plazas.push({ x: 0, y: 0, r: 13 });
  for (let a = TAU * 0.71; a < TAU * 0.96; a += 0.085) for (const r of [93, 101]) {
    if (nearGate(a)) continue;
    M.buildings.push(mkB(rectPts(Math.cos(a) * r, Math.sin(a) * r, 4.4, 4.4, a), { h: 2.8, wall: '#cfc8b8', roof: '#8f3a3a', roofType: 'tent', rh: 3, army: true }));
  }
  for (const a of gAng) for (const d of [-1, 1]) M.towers.push({ x: Math.cos(a + d * 0.1) * 78, y: Math.sin(a + d * 0.1) * 78, r: 2.2, h: 9, roof: true });
  const pc = [-88, 62], pw = 24, ph = 16;
  M.walls.push({ a: [pc[0] - pw / 2, pc[1] - ph / 2], b: [pc[0] + pw / 2, pc[1] - ph / 2], t: 0.5, h: 1.2, rail: true }, { a: [pc[0] + pw / 2, pc[1] - ph / 2], b: [pc[0] + pw / 2, pc[1] + ph / 2], t: 0.5, h: 1.2, rail: true },
    { a: [pc[0] + pw / 2, pc[1] + ph / 2], b: [pc[0] - pw / 2, pc[1] + ph / 2], t: 0.5, h: 1.2, rail: true }, { a: [pc[0] - pw / 2, pc[1] + ph / 2], b: [pc[0] - pw / 2, pc[1] - ph / 2], t: 0.5, h: 1.2, rail: true });
  for (let i = 0; i < 8; i++) M.buildings.push(mkB(rectPts(pc[0] + (R() - 0.5) * 18, pc[1] + (R() - 0.5) * 9, 2.4, 1.3, R() * TAU), { h: 1.3, wall: pick(R, ['#8a6a47', '#d9d0b8', '#9a9a9a']), roof: '#6b5a44', roofType: 'flat', animal: true, noPoi: true }));
  M.trails.push({ pts: [[-112, 12], [-100, 8], [-90, 4]] });
  for (let n = 0; n < 40; n++) {
    const a = R() * TAU, r = 94 + R() * 15, x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (Math.abs(x) > 106 || Math.abs(y) > 106 || M.hit(x, y, 2) || nearGate(a)) continue;
    if (Math.hypot(x - pc[0], y - pc[1]) < 18) continue;
    M.trees.push({ x, y, r: 2 + R() * 2, t: R() < 0.4 ? 1 : 0 });
  }
}

/* ============ cidade dentro da árvore (Terranova) ============ */
function genTree(M, R) {
  const th = M.theme;
  M.trunk = { r: 14, h: 84 };
  M.levels = [{ r0: 22, r1: 42, y: 0 }, { r0: 44, r1: 64, y: 22 }, { r0: 66, r1: 86, y: 44 }];
  M.walkAngles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];
  const near = a => M.walkAngles.some(w => Math.abs(((a - w + Math.PI) % TAU + TAU) % TAU - Math.PI) < 0.11);
  M.levels.forEach((L, i) => {
    for (const j of [0, 1]) {
      const rr = lerp(L.r0 + 4.2, L.r1 - 4.2, j), n = Math.floor(TAU * rr / 9.3);
      for (let k = 0; k < n; k++) {
        const a = (k + j * 0.5) / n * TAU; if (near(a)) continue;
        M.buildings.push(mkB(rectPts(Math.cos(a) * rr, Math.sin(a) * rr, 6.2, 5.2, a + Math.PI / 2), { y0: L.y + 1.4, h: 3.8 + R() * 1.8, wall: pick(R, th.walls), roof: pick(R, th.roofs), roofType: R() < 0.6 ? 'pyr' : 'gable', rh: 2.6, level: i }));
      }
    }
  });
  M.roads.push({ pts: [[0, 112], [0, 40]], w: 5, main: true });
  M.gates = [[0, 98]];
  M.roots = []; for (let k = 0; k < 9; k++) M.roots.push(k / 9 * TAU + 0.2);
  M.leaves = [];
  M.levels.forEach((L, i) => { for (let n = 0; n < 16; n++) { const a = R() * TAU; if (near(a)) continue; M.leaves.push({ a, r: L.r1 + 1 + R() * 6, y: L.y + 2 + R() * 7, s: 4 + R() * 4 }); } });
  for (let n = 0; n < 9; n++) { const a = n / 9 * TAU + R() * 0.5, r = 6 + R() * 12; M.leaves.push({ a, r, y: 78 + R() * 12, s: 10 + R() * 5 }); }
  M.pond = { x: -72, y: 76, r: 14 };
  for (let n = 0; n < 130; n++) {
    const a = R() * TAU, r = 92 + R() * 22, x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (Math.abs(x) > 108 || Math.abs(y) > 108 || Math.hypot(x - M.pond.x, y - M.pond.y) < M.pond.r + 3 || (Math.abs(x) < 5 && y > 0)) continue;
    M.trees.push({ x, y, r: 2.4 + R() * 2.4, t: R() < 0.5 ? 1 : 0 });
  }
}

/* ============ pontos de interesse ============ */
function ruleScore(M, rule) {
  const gates = M.gates || [];
  switch (rule) {
    case 'center': return q => -Math.hypot(q.cx, q.cy);

}
function coastNear(px, py) {
  let best = null;
  for (let a = 0; a < 360; a += 15) {
    const ca = Math.cos(a * Math.PI / 180), sa = Math.sin(a * Math.PI / 180);
    for (let d = 4; d < 80; d += 3) { const x = Math.round(px + ca * d), y = Math.round(py + sa * d); if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) break; if (REG[y * MAP_W + x] === 0) { if (!best || d < best.d) best = { d, ang: a }; break; } }
  }
  return best ? { ang: best.ang, near: best.d } : null;
}
function canPlace(M, x, y) {
  if (Math.abs(x) > M.B - 4 || Math.abs(y) > M.B - 4) { toast('Fora dos limites da cidade.'); return false; }
  if (M.isWater && M.isWater(x, y, 0)) { toast('Não dá para construir na água.'); return false; }
  if (M.isChasm && M.isChasm(x, y)) { toast('Não dá para construir sobre o abismo.'); return false; }
  return true;
}

/* ---- clique do mapa com uma ferramenta ativa ---- */
function toolClick(e) {
  const w = worldAt(e.clientX, e.clientY); if (!w) { toast('Clique sobre o mapa.'); return; }
  const t = S.tool;
  if (S.scope === 'continent') {
    if (w.px < 0 || w.py < 0 || w.px >= MAP_W || w.py >= MAP_H) return;
    const px = Math.round(w.px), py = Math.round(w.py);
    if (t === 'move') return moveCityTo(S.moving.id, px, py);
    const reg = REG[py * MAP_W + px], kid = REGION_K[reg] || 'itinerante';
    const kopts = KINGDOMS.map(k => [k.id, k.name]).concat([['itinerante', 'Sem reino']]);
    if (t === 'city') {
      const cn = coastNear(px, py);
      openForm({ title: 'Nova cidade', okLabel: 'Criar cidade', fields: [
        { k: 'name', label: 'Nome', value: '', req: true }, { k: 'kid', label: 'Reino', type: 'select', opts: kopts, value: kid },
        { k: 'size', label: 'Tamanho', type: 'select', opts: [['p', 'Pequena'], ['m', 'Média'], ['g', 'Grande']], value: 'm' },
        { k: 'coast', label: 'Cidade costeira (porto)', type: 'check', value: !!(cn && cn.near < 40) }, { k: 'wall', label: 'Com muralhas', type: 'check', value: true },
        { k: 'blurb', label: 'Descrição', type: 'area', value: '' }],
        ok: v => { const co = v.coast ? (coastNear(px, py) || { ang: 90 }) : null; U.places.push({ id: 'c' + uid(), kind: 'city', name: v.name.trim(), k: v.kid, px, py, size: v.size, coast: co ? { ang: co.ang } : null, wall: v.wall, blurb: v.blurb.trim() }); afterContinentEdit(U.places[U.places.length - 1].id); } });
    } else if (t === 'landmark') {
      openForm({ title: 'Novo ponto importante', okLabel: 'Criar', fields: lmFields({ kid }).concat([{ k: 'mkdg', label: 'Gerar um mapa de masmorra para este ponto', type: 'check', value: false }]),
        ok: v => {
          const pl = { id: 'l' + uid(), kind: 'landmark', name: v.name.trim(), k: v.kid, px, py, tipo: v.tipo, icon: v.icon, color: v.color, blurb: v.blurb.trim() };
          U.places.push(pl); afterContinentEdit(pl.id);
          if (v.mkdg) newDungeonForm(pl.id);
        } });
    }
    setTool(null); return;
  }
  const M = CS.M; if (M.dungeon) return dgToolClick(w);
  if (!canPlace(M, w.x, w.y)) return;
  const id = M.def.id;
  if (t === 'move') return movePoiTo(S.moving.id, w.x, w.y);
  if (t === 'poi') {
    const cats = CITY_CATS.map(k => [k, CATS[k].label]);
    openForm({ title: 'Novo local', okLabel: 'Criar local', fields: [
      { k: 'name', label: 'Nome', value: '', req: true }, { k: 'cat', label: 'Categoria', type: 'select', opts: cats, value: 'comercio' },
      { k: 'label', label: 'Tipo (ex.: Ferraria, Taverna)', value: '' }, { k: 'icon', label: 'Ícone no mapa', type: 'select', opts: [['', 'Número']].concat(ICON_OPTS), value: '' }, { k: 'desc', label: 'Descrição', type: 'area', value: '' }, { k: 'tags', label: 'Etiquetas (separadas por vírgula)', value: '' }],
      ok: v => { const a = { uid: uid(), name: v.name.trim(), cat: v.cat, label: v.label.trim() || CAT_LABEL[v.cat], icon: v.icon, desc: v.desc.trim(), tags: splitTags(v.tags), x: w.x, y: w.y }; (U.poiAdd[id] = U.poiAdd[id] || []).push(a); saveU(); refreshCity(id + ':u' + a.uid); toast('Local criado.'); } });
    setTool(null);
  } else if (t === 'build') {
    (U.decor[id] = U.decor[id] || []).push({ t: 'b', x: w.x, y: w.y, w: BUILD.w, d: BUILD.d, h: BUILD.h, wall: BUILD.wall, roof: BUILD.roof, ang: BUILD.ang }); saveU(); refreshCity();
  } else if (t === 'tree') {
    (U.decor[id] = U.decor[id] || []).push({ t: 'tree', x: w.x, y: w.y, r: 2 + Math.random() * 1.8, k: Math.random() < 0.35 ? 1 : 0 }); saveU(); refreshCity();
  } else if (t === 'erase') {
    const list = U.decor[id] || []; let bi = -1, bd = 7;
    list.forEach((d, i) => { const dd = Math.hypot(d.x - w.x, d.y - w.y); if (dd < bd) { bd = dd; bi = i; } });
    if (bi < 0) { toast('Nada seu por perto para apagar.'); return; }
    list.splice(bi, 1); saveU(); refreshCity();
  }
}
const splitTags = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean).slice(0, 8);

/* ---- atualizações ---- */
function afterContinentEdit(selId) {
  saveU(); applyCitiesFromUser(); rebuildPins(); buildMarkers(); renderAtlas(); renderEtools();
  if (selId && CITY[selId]) select({ type: 'city', id: selId }); else { S.sel = null; renderCard(); }
  dirty = true; toast('Alterações salvas.');
}
function refreshCity(selectId) {
  const def = CS.M.def;
  if (CS.M.dungeon) { const dg = U.dungeons.find(d => d.id === def.id); const hr = CS.M.homeR; CS.M = buildDungeonModel(dg); CS.M.homeR = hr; } else { delete _modelCache[def.id]; CS.M = buildCityModel(def); }
  if (CS.c3) { CS.c3.dispose(); CS.c3 = null; } CS.scene = null; if (S.mode === '3d') ensureCity3D();
  const keepSel = selectId || (S.sel && S.sel.type === 'poi' ? S.sel.id : null);
  S.sel = null; CS.sel = null; renderAtlas(); buildMarkers(); renderCrumb();
  if (keepSel && CS.M.pois.some(p => p.id === keepSel)) select({ type: 'poi', id: keepSel }); else renderCard();
  dirty = true;
}
function moveCityTo(id, px, py) {
  const c = CITY[id], pl = U.places.find(p => p.id === id);
  if (pl) { pl.px = px; pl.py = py; } else U.cityEdit[id] = Object.assign(U.cityEdit[id] || {}, { px, py });
  setTool(null); afterContinentEdit(id);
}
function movePoiTo(id, x, y) {
  const p = CS.M.pois.find(q => q.id === id); setTool(null); if (!p) return;
  if (CS.M.dungeon) { const dg = U.dungeons.find(d => d.id === CS.M.def.id), m = dg && dg.marks.find(q => q.uid === p.uid); if (m && CS.M.cellAt(x, y) > 0) { m.x = x; m.y = y; saveU(); refreshCity(id); } else toast('Clique sobre o piso.'); return; }
  if (p.user) { const a = (U.poiAdd[CS.M.def.id] || []).find(q => q.uid === p.uid); if (a) { a.x = x; a.y = y; } }
  else U.poiEdit[id] = Object.assign(U.poiEdit[id] || {}, { x, y });
  saveU(); refreshCity(id);
}

/* ---- botões do cartão ---- */
function editSelected() {
  const s = S.sel; if (!s) return;
  if (s.type === 'city') {
    const c = CITY[s.id], pl = U.places.find(p => p.id === s.id), kopts = KINGDOMS.map(k => [k.id, k.name]).concat([['itinerante', 'Sem reino']]);
    const isLm = !!(pl && pl.kind === 'landmark');
    let fields;
    if (isLm) { fields = lmFields({ name: c.name, kid: pl.k, tipo: pl.tipo || 'Outro', icon: pl.icon || '', color: pl.color || '' }); fields.find(f => f.k === 'blurb').value = c.blurb; }
    else { fields = [{ k: 'name', label: 'Nome', value: c.name, req: true }]; if (pl) fields.push({ k: 'kid', label: 'Reino', type: 'select', opts: kopts, value: pl.k }); fields.push({ k: 'blurb', label: 'Descrição', type: 'area', rows: 6, value: c.blurb }); }
    openForm({ title: 'Editar ' + c.name, fields, ok: v => {
      if (pl) { pl.name = v.name.trim(); pl.blurb = v.blurb.trim(); pl.k = v.kid; if (v.tipo) { pl.tipo = v.tipo; pl.icon = v.icon; pl.color = v.color; } } else U.cityEdit[c.id] = Object.assign(U.cityEdit[c.id] || {}, { name: v.name.trim(), blurb: v.blurb.trim() });
      if (S.scope === 'city') { saveU(); applyCitiesFromUser(); CS.M.def = CITY[c.id]; renderCrumb(); renderCard(); } else afterContinentEdit(c.id);
    } });
  } else if (s.type === 'poi' && CS.M.dungeon) { dgEditPoi();
  } else if (s.type === 'poi') {
    const p = CS.M.pois.find(q => q.id === s.id), cats = CITY_CATS.map(k => [k, CATS[k].label]);
    openForm({ title: 'Editar local', del: () => deleteSelected(), fields: [
      { k: 'name', label: 'Nome', value: p.name, req: true }, { k: 'cat', label: 'Categoria', type: 'select', opts: cats, value: p.cat },
      { k: 'label', label: 'Tipo', value: p.label }, { k: 'icon', label: 'Ícone no mapa', type: 'select', opts: [['', 'Número']].concat(ICON_OPTS), value: p.icon || '' }, { k: 'desc', label: 'Descrição', type: 'area', rows: 6, value: p.desc }, { k: 'tags', label: 'Etiquetas (separadas por vírgula)', value: p.tags.join(', ') }],
      ok: v => {
        const d = { name: v.name.trim(), cat: v.cat, label: v.label.trim() || CAT_LABEL[v.cat], icon: v.icon, desc: v.desc.trim(), tags: splitTags(v.tags) };
        if (p.user) { const a = (U.poiAdd[CS.M.def.id] || []).find(q => q.uid === p.uid); if (a) Object.assign(a, d); } else U.poiEdit[p.id] = Object.assign(U.poiEdit[p.id] || {}, d);
        saveU(); refreshCity(p.id); toast('Alterações salvas.');
      } });
  }
}
function deleteSelected() {
  const s = S.sel; if (!s) return;
  if (s.type === 'city') {
    const c = CITY[s.id]; if (!c.custom) return;
    confirmBox('Excluir ' + c.name + '?', 'O ponto e, se houver, o mapa da cidade serão removidos.', 'Excluir', () => {
      U.places = U.places.filter(p => p.id !== c.id); delete U.cityEdit[c.id]; delete U.poiAdd[c.id]; delete U.decor[c.id]; delete U.poiEdit[c.id];
      S.sel = null; afterContinentEdit(null); });
  } else if (s.type === 'poi' && CS.M.dungeon) {
    const p = CS.M.pois.find(q => q.id === s.id); if (!p.mark) return; const dg = U.dungeons.find(d => d.id === CS.M.def.id);
    confirmBox('Excluir ' + p.name + '?', 'A marcação será removida da masmorra.', 'Excluir', () => { dg.marks = dg.marks.filter(m => m.uid !== p.uid); saveU(); S.sel = null; refreshCity(); toast('Marcação excluída.'); });
  } else if (s.type === 'poi') {
    const p = CS.M.pois.find(q => q.id === s.id), id = CS.M.def.id;
    confirmBox('Excluir ' + p.name + '?', 'O local sai da lista e do mapa da cidade.', 'Excluir', () => {
      if (p.user) U.poiAdd[id] = (U.poiAdd[id] || []).filter(a => a.uid !== p.uid); else { if (!U.poiDel.includes(p.id)) U.poiDel.push(p.id); delete U.poiEdit[p.id]; }
      saveU(); S.sel = null; refreshCity(); toast('Local excluído.'); });
  }
}
function moveSelected() { if (!S.sel) return; S.moving = { id: S.sel.id }; setTool('move'); }

/* ---- cidade: dados, restaurar, prédio ---- */
function cityInfo() { if (CS.M.dungeon) return dgConfig(); S.sel = { type: 'city', id: CS.M.def.id }; editSelected(); S.sel = null; }
function cityReset() {
  const id = CS.M.def.id;
  confirmBox('Restaurar ' + CS.M.def.name + '?', 'Remove todos os locais, prédios e árvores que você adicionou ou alterou nesta cidade.', 'Restaurar', () => {
    U.poiAdd[id] = []; U.decor[id] = []; U.poiDel = U.poiDel.filter(x => !x.startsWith(id + ':')); for (const k of Object.keys(U.poiEdit)) if (k.startsWith(id + ':')) delete U.poiEdit[k];
    saveU(); S.sel = null; refreshCity(); toast('Cidade restaurada.'); });
}
function buildCfg() {
  openForm({ title: 'Prédio', okLabel: 'Escolher posição', fields: [
    { k: 'w', label: 'Largura', type: 'number', value: BUILD.w, min: 3, max: 30 }, { k: 'd', label: 'Profundidade', type: 'number', value: BUILD.d, min: 3, max: 30 },
    { k: 'h', label: 'Altura', type: 'number', value: BUILD.h, min: 2, max: 30 }, { k: 'ang', label: 'Rotação (graus)', type: 'number', value: BUILD.ang, min: 0, max: 359 },
    { k: 'wall', label: 'Cor da parede', type: 'color', value: BUILD.wall }, { k: 'roof', label: 'Cor do telhado', type: 'color', value: BUILD.roof }],
    ok: v => { Object.assign(BUILD, { w: v.w || 8, d: v.d || 7, h: v.h || 6, ang: v.ang || 0, wall: v.wall, roof: v.roof }); setTool('build'); } });
}

/* ---- exportar / importar ---- */
function exportBox() {
  const json = JSON.stringify(U);
  openForm({ title: 'Exportar / importar', okLabel: 'Importar', msg: 'Copie o texto abaixo para guardar ou compartilhar. Para carregar dados, cole aqui e clique em Importar.',
    fields: [{ k: 'json', label: 'Dados do atlas', type: 'area', rows: 9, value: json }],
    extra: [{ label: 'Copiar', fn: () => { const ta = $('#f_json'); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) { } if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(() => { }); toast('Texto selecionado/copiado.'); } },
      { label: 'Restaurar tudo', fn: () => { closeForm(); confirmBox('Restaurar tudo?', 'Apaga todas as suas alterações (cidades, pontos e edições) deste navegador.', 'Restaurar tudo', () => { U = normU(BASE_USER); saveU(); applyAll(); toast('Tudo restaurado.'); }); } }],
    ok: v => { let o; try { o = JSON.parse(v.json); } catch (_) { toast('Texto inválido.'); return; } U = normU(o); saveU(); applyAll(); toast('Dados importados.'); } });
}
function applyAll() {
  applyCitiesFromUser(); Object.keys(_modelCache).forEach(k => delete _modelCache[k]);
  if (S.scope === 'city' && (CS.M.dungeon ? !U.dungeons.some(d => d.id === S.city) : !CITY[S.city])) { S.sel = null; exitCity(); return; }
  if (S.scope === 'city') { if (!CS.M.dungeon) CS.M.def = CITY[S.city]; refreshCity(); }
  else { rebuildPins(); buildMarkers(); renderAtlas(); S.sel = null; select(null); }
}

/* ---- campos do ponto importante ---- */
function lmFields(o) {
  const kopts = KINGDOMS.map(k => [k.id, k.name]).concat([['itinerante', 'Sem reino']]);
  return [{ k: 'name', label: 'Nome', value: o.name || '', req: true }, { k: 'tipo', label: 'Tipo', type: 'select', opts: LM_TYPES.map(x => [x, x]), value: o.tipo || 'Ruína' },
    { k: 'icon', label: 'Ícone', type: 'select', opts: [['', 'Automático (pelo tipo)']].concat(ICON_OPTS), value: o.icon || '' },
    { k: 'color', label: 'Cor', type: 'select', opts: MARK_COLORS, value: o.color || '' },
    { k: 'kid', label: 'Reino', type: 'select', opts: kopts, value: o.kid || 'itinerante' }, { k: 'blurb', label: 'Descrição', type: 'area', rows: 5, value: '' }];
}

/* ---- masmorras ---- */
function newDungeonForm(linkId) {
  const link = linkId && U.places.find(p => p.id === linkId);
  openForm({ title: 'Gerar masmorra', okLabel: 'Gerar', msg: 'A mesma semente sempre gera a mesma masmorra. Depois você pode anotar as salas e colocar marcações.',
    fields: [{ k: 'name', label: 'Nome', value: link ? link.name : 'Masmorra sem nome', req: true },
      { k: 'style', label: 'Estilo', type: 'select', opts: Object.keys(DG_STYLES).map(k => [k, DG_STYLES[k]]), value: link && link.tipo === 'Caverna' ? 'caverna' : 'masmorra' },
      { k: 'size', label: 'Tamanho', type: 'select', opts: Object.keys(DG_SIZES).map(k => [k, DG_SIZES[k][2]]), value: 'm' },
      { k: 'rooms', label: 'Quantidade de salas / áreas (4 a 30)', type: 'number', value: 12, min: 4, max: 30 },
      { k: 'seed', label: 'Semente', value: uid() }],
    ok: v => {
      const dg = { id: 'd' + uid(), name: v.name.trim(), seed: v.seed.trim() || uid(), style: v.style, size: v.size, rooms: clamp(parseInt(v.rooms) || 12, 4, 30), notes: {}, marks: [] };
      U.dungeons.push(dg); if (link) link.dg = dg.id; saveU(); applyCitiesFromUser();
      if (S.scope === 'continent') { buildMarkers(); renderAtlas(); }
      enterDungeon(dg.id);
    } });
}
function dgCur() { return U.dungeons.find(d => d.id === CS.M.def.id); }
function dgRegen() {
  const dg = dgCur(), go = () => { dg.seed = uid(); dg.notes = {}; dg.marks = []; saveU(); S.sel = null; refreshCity(); renderCard(); };
  if (Object.keys(dg.notes).length || dg.marks.length) confirmBox('Gerar outra masmorra?', 'As anotações e marcações desta masmorra serão removidas.', 'Gerar outra', go); else go();
}
function dgConfig() {
  const dg = dgCur();
  openForm({ title: 'Configurar masmorra', msg: 'Mudar estilo, tamanho, salas ou semente gera outro mapa e remove anotações e marcações.',
    fields: [{ k: 'name', label: 'Nome', value: dg.name, req: true }, { k: 'style', label: 'Estilo', type: 'select', opts: Object.keys(DG_STYLES).map(k => [k, DG_STYLES[k]]), value: dg.style },
      { k: 'size', label: 'Tamanho', type: 'select', opts: Object.keys(DG_SIZES).map(k => [k, DG_SIZES[k][2]]), value: dg.size },
      { k: 'rooms', label: 'Quantidade de salas / áreas', type: 'number', value: dg.rooms, min: 4, max: 30 }, { k: 'seed', label: 'Semente', value: dg.seed }],
    ok: v => {
      const rooms = clamp(parseInt(v.rooms) || 12, 4, 30), changed = v.style !== dg.style || v.size !== dg.size || rooms !== dg.rooms || v.seed.trim() !== dg.seed;
      dg.name = v.name.trim(); if (changed) Object.assign(dg, { style: v.style, size: v.size, rooms, seed: v.seed.trim() || uid(), notes: {}, marks: [] });
      saveU(); S.sel = null; refreshCity(); renderCrumb(); toast('Masmorra atualizada.');
    } });
}
function dgDelete() {
  const dg = dgCur();
  confirmBox('Excluir ' + dg.name + '?', 'A masmorra e todas as anotações dela serão apagadas.', 'Excluir', () => {
    U.dungeons = U.dungeons.filter(d => d.id !== dg.id); U.places.forEach(p => { if (p.dg === dg.id) p.dg = ''; }); saveU(); applyCitiesFromUser(); exitCity(); toast('Masmorra excluída.'); });
}
function dgToolClick(w) {
  const M = CS.M;
  if (S.tool === 'move') return movePoiTo(S.moving.id, w.x, w.y);
  if (M.cellAt(w.x, w.y) <= 0) { toast('Clique sobre o piso da masmorra.'); return; }
  const dg = dgCur(), x = Math.round(w.x * 2) / 2, y = Math.round(w.y * 2) / 2;
  openForm({ title: 'Nova marcação', okLabel: 'Criar', fields: [{ k: 'name', label: 'Nome', value: '', req: true }, { k: 'icon', label: 'Ícone', type: 'select', opts: ICON_OPTS, value: 'unknown' },
    { k: 'color', label: 'Cor', type: 'select', opts: MARK_COLORS.map((c, i) => i ? c : ['', 'Padrão']), value: '' }, { k: 'desc', label: 'Descrição', type: 'area', value: '' }],
    ok: v => { const m = { uid: uid(), x, y, icon: v.icon, name: v.name.trim(), desc: v.desc.trim(), color: v.color }; dg.marks.push(m); saveU(); refreshCity(dg.id + ':m' + m.uid); toast('Marcação criada.'); } });
  setTool(null);
}
function dgEditPoi() {
  const p = CS.M.pois.find(q => q.id === S.sel.id), dg = dgCur();
  if (p.room) {
    openForm({ title: 'Editar ' + p.name, fields: [{ k: 'name', label: 'Nome', value: p.name, req: true }, { k: 'desc', label: 'Descrição / anotações', type: 'area', rows: 6, value: p.desc }],
      ok: v => { dg.notes[p.n] = { name: v.name.trim(), desc: v.desc.trim() }; saveU(); refreshCity(p.id); toast('Alterações salvas.'); } });
  } else {
    const m = dg.marks.find(q => q.uid === p.uid);
    openForm({ title: 'Editar marcação', del: () => deleteSelected(), fields: [{ k: 'name', label: 'Nome', value: m.name, req: true }, { k: 'icon', label: 'Ícone', type: 'select', opts: ICON_OPTS, value: m.icon },
      { k: 'color', label: 'Cor', type: 'select', opts: MARK_COLORS.map((c, i) => i ? c : ['', 'Padrão']), value: m.color || '' }, { k: 'desc', label: 'Descrição', type: 'area', rows: 5, value: m.desc || '' }],
      ok: v => { Object.assign(m, { name: v.name.trim(), icon: v.icon, color: v.color, desc: v.desc.trim() }); saveU(); refreshCity(p.id); toast('Alterações salvas.'); } });
  }
}

boot();
